<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Review Toolbox</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/tabs.css" />
  <link rel="stylesheet" href="css/table.css" />
  <link rel="stylesheet" href="css/findings.css" />
  <link rel="stylesheet" href="css/modal.css" />
  <link rel="stylesheet" href="css/terminal.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="app-title">
        Access Review Toolbox
        <small>v1.0</small>
      </div>
      <nav id="module-list"></nav>
      <div id="config-section">
        <button id="btn-load-config" class="sidebar-btn">Load Config</button>
        <button id="btn-new-config"  class="sidebar-btn">New Config</button>
        <div id="config-status"></div>
      </div>
    </aside>

    <main id="main">
      <header id="top-bar">
        <div id="dump-info">No dump loaded</div>
        <select id="dump-selector" disabled><option>-- No dumps --</option></select>
        <button id="btn-create-dump" disabled>Create Dump</button>
        <button id="btn-toggle-terminal" title="Toggle debug terminal">&gt;_ Console</button>
      </header>

      <div id="progress-bar-wrap">
        <div id="progress-bar-track"><div id="progress-bar-fill"></div></div>
        <span id="progress-label"></span>
      </div>

      <div id="tab-bar"></div>
      <div id="tab-panels"></div>

      <!-- Debug terminal panel (slide-up from bottom) -->
      <div id="terminal-panel">
        <div id="terminal-toolbar">
          <span class="term-title">PS Console</span>
          <span id="terminal-status" class="term-status idle">idle</span>
          <button id="btn-term-clear">Clear</button>
        </div>
        <div id="terminal-output"></div>
      </div>
    </main>
  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <div id="modal-title"></div>
      <div id="modal-body"></div>
      <div id="modal-footer">
        <button id="modal-cancel" class="btn-secondary">Cancel</button>
        <button id="modal-confirm" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Core JS — load order matters -->
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/config.js"></script>
  <script src="js/dump-manager.js"></script>
  <script src="js/ps-bridge.js"></script>
  <script src="js/table-renderer.js"></script>
  <script src="js/findings-engine.js"></script>
  <script src="js/terminal.js"></script>

  <!-- Module JS -->
  <script src="js/modules/ad.js"></script>
  <script src="js/modules/fortigate.js"></script>
  <script src="js/modules/f5.js"></script>

  <!-- Bootstrap — must be last -->
  <script src="js/app.js"></script>
</body>
</html>
