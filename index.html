<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Review Toolbox</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/tabs.css" />
  <link rel="stylesheet" href="css/table.css" />
  <link rel="stylesheet" href="css/findings.css" />
  <link rel="stylesheet" href="css/modal.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="app-title">Access Review Toolbox</div>
      <nav id="module-list"></nav>
      <div id="config-section">
        <button id="btn-load-config">Load Config</button>
        <button id="btn-new-config">New Config</button>
        <div id="config-status"></div>
      </div>
    </aside>

    <main id="main">
      <header id="top-bar">
        <div id="dump-info">No dump loaded</div>
        <select id="dump-selector" disabled><option>-- No dumps --</option></select>
        <button id="btn-create-dump" disabled>Create Dump</button>
      </header>

      <div id="tab-bar"></div>
      <div id="tab-panels"></div>
    </main>
  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <div id="modal-title"></div>
      <div id="modal-body"></div>
      <div id="modal-footer">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-confirm">Save</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Core JS — load order matters -->
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/config.js"></script>
  <script src="js/dump-manager.js"></script>
  <script src="js/ps-bridge.js"></script>
  <script src="js/table-renderer.js"></script>
  <script src="js/findings-engine.js"></script>

  <!-- Module JS -->
  <script src="js/modules/ad.js"></script>
  <script src="js/modules/fortigate.js"></script>
  <script src="js/modules/f5.js"></script>

  <!-- Bootstrap — must be last -->
  <script src="js/app.js"></script>
</body>
</html>
